<html lang="es">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Concepto: papel y tinta. Una sola frase, una sola cifra en puntos redondos, un sello rojo (hanko) como firma. Todo en minúsculas, mucho vacío. */
:root {
  --bg: #F4F2EE;
  --card: #FBFAF7;
  --fg: #161616;
  --muted: #8C8880;
  --faint: #DAD6CF;
  --line: #E4E1DB;
  --accent: #33558F;
  --accent-soft: #C9D5EC;
  --done: #D6D1C8;
  --on: #F4F2EE;
  --sans: "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="papel"]) {
    --bg: #131313; --card: #1B1B1A; --fg: #EEEBE5; --muted: #77746E; --faint: #2B2A28; --line: #232220; --accent: #98AEDB; --accent-soft: #283A5E; --done: #33312D; --on: #131313;
    color-scheme: dark;
  }
}
:root[data-theme="papel"] {
  --bg: #F0E7D8; --card: #F8F2E7; --fg: #1F1B16; --muted: #8C8070; --faint: #E0D4C1; --line: #E6DBCA; --accent: #2F5089; --accent-soft: #CBD3E0; --done: #DDD0BC; --on: #F0E7D8;
  color-scheme: light;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] {
  --bg: #131313; --card: #1B1B1A; --fg: #EEEBE5; --muted: #77746E; --faint: #2B2A28; --line: #232220; --accent: #98AEDB; --accent-soft: #283A5E; --done: #33312D; --on: #131313;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
#app { max-width: 480px; margin: 0 auto; padding-inline: 20px; padding-block: 16px 110px; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
h1 { margin: 0; font-weight: 800; font-size: 40px; letter-spacing: -.04em; line-height: 1; }
.muted { color: var(--muted); }
.num { font-family: var(--sans); font-weight: 500; line-height: .9; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.num small { font-weight: 500; font-size: .32em; margin-left: .04em; letter-spacing: 0; }
.seal { width: 30px; height: 34px; border-radius: 4px; background: var(--accent); color: var(--on); font-size: 11px; line-height: 1.05; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; flex: none; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }

/* Inicio */
.home { min-height: calc(100svh - 130px); display: flex; flex-direction: column; justify-content: space-between; gap: 28px; }
.hometop { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; }
.homemid { display: flex; flex-direction: column; }
.big { font-weight: 500; font-size: clamp(132px, 42vw, 190px); line-height: .82; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-top: 28px; display: flex; align-items: flex-start; }
.big sup { font-size: .2em; letter-spacing: 0; margin: .1em 0 0 .22em; line-height: 1; }
.home .sum { font-size: 19px; font-weight: 500; letter-spacing: -.01em; margin-top: 18px; }
.home .sum button { text-decoration: underline; text-underline-offset: 3px; }
.lab { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.home .big { margin-top: 36px; padding-top: .06em; font-size: clamp(116px, 36vw, 168px); line-height: .9; }
.home .date { font-size: 15px; color: var(--muted); margin: 16px 0 0; }
.home p.sum { margin: 14px 0 0; font-size: 17px; text-wrap: pretty; }
.home .phrase { font-size: clamp(28px, 8.4vw, 38px); }
.tile .diff .ast { width: 12px; height: 12px; }
.kanji { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; font-size: 17px; letter-spacing: .05em; }
.ast { width: 1em; height: 1em; display: inline-block; vertical-align: middle; fill: currentColor; flex: none; }
.ast.xs { width: 10px; height: 10px; }
.ast.m { opacity: .5; }
.diff { display: inline-flex; gap: 2px; color: var(--muted); }
.hoyhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.ring { position: relative; width: 240px; max-width: 100%; aspect-ratio: 1; margin: 30px auto 0; }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .num { font-size: 68px; }
.ring .cap { margin-top: 8px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--card); border-radius: 20px; padding: 14px; min-height: 118px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; text-align: left; position: relative; overflow: hidden; min-width: 0; }
.tile .tt { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.tile .tn { font-weight: 700; font-size: 16px; letter-spacing: -.02em; line-height: 1.15; overflow-wrap: anywhere; }
.tile .tb { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.tile .tm { font-size: 11px; color: var(--muted); }
.tile .tick { display: inline-flex; flex: none; color: var(--faint); }
.tile .tick .ast { width: 24px; height: 24px; }
.tile.done { background: var(--done); }
.tile.done .tick { color: var(--accent); }
.tile .tv { font-weight: 500; font-size: 30px; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .tv small { font-size: 13px; letter-spacing: 0; color: var(--muted); margin-left: 3px; }
.tile .tstep { display: flex; gap: 6px; margin-top: 10px; }
.tile .tstep button { flex: 1; height: 34px; border-radius: 999px; background: var(--bg); font-size: 18px; color: var(--fg); }
.tile.done .tstep button { background: var(--bg); }
.tile .tbar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
.strip2 { display: flex; gap: 8px; overflow-x: auto; margin-inline: -20px; padding: 0 20px 6px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.strip2::-webkit-scrollbar { display: none; }
.mini { flex: 0 0 142px; scroll-snap-align: start; background: var(--card); border-radius: 18px; padding: 13px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.mini .tn { font-weight: 700; font-size: 15px; letter-spacing: -.02em; line-height: 1.15; }
.mini .slots { display: flex; gap: 4px; align-items: center; min-height: 14px; flex-wrap: wrap; }
.mini .slots .ast { width: 15px; height: 15px; color: var(--faint); }
.mini .slots .ast.on { color: var(--accent); }
.mini .tm { font-size: 11px; color: var(--muted); }
.mini.done { background: var(--done); }
.mini.full { opacity: .55; }
.yeargrid .ast { width: 11px; height: 11px; color: var(--faint); }
.yeargrid .ast.c-n { opacity: .55; }
.yeargrid .ast.c-l2 { color: var(--muted); opacity: .6; }
.yeargrid .ast.c-l3 { color: var(--accent); opacity: .55; }
.yeargrid .ast.c-l4 { color: var(--accent); }
.yeargrid .ast.c-fut { opacity: .25; }
.yeargrid .ast.c-t { color: var(--fg); }
.dd { background: none !important; color: var(--faint); box-shadow: none !important; border-radius: 50%; }
.dd .ast { width: 20px; height: 20px; display: block; }
.dd.done { color: var(--accent); }
.dd.part { color: var(--accent); opacity: .5; }
.dd.plan { color: var(--muted); }
.wkbars .ast { width: 9px; height: 9px; color: var(--faint); }
.wkbars .ast.on { color: var(--accent); }
.kpis { display: flex; gap: 32px; margin-top: 16px; }
.kpis b { display: block; font-weight: 500; font-size: 26px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.kpis span { font-size: 13px; color: var(--muted); }
.ringwrap { margin-top: 18px; }
.ringwrap .num { font-size: 76px; margin-top: 14px; }
.phrase { display: block; text-align: left; font-weight: 800; font-size: clamp(32px, 9.5vw, 42px); line-height: 1.04; letter-spacing: -.035em; text-wrap: balance; }
.phrase .w { display: inline-block; opacity: 0; transform: translateY(.25em); animation: wIn .5s ease forwards; }
.phrase .dim { color: var(--muted); }
@keyframes wIn { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .phrase .w { animation: none; opacity: 1; transform: none; } }
#app input.line { width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; color: var(--fg); font: inherit; font-size: 17px; padding: 10px 0; }
#app input.line::placeholder { color: var(--muted); }
.ly { font-size: 13px; color: var(--muted); margin-top: 10px; }
.nav { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 5; padding-inline: 16px; pointer-events: none; }
.nav > div { pointer-events: auto; max-width: 400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 2px; padding: 6px; border-radius: 999px; background: color-mix(in srgb, var(--card) 80%, transparent); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.10); }
.nav button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; min-width: 48px; padding: 0 14px; border-radius: 999px; color: var(--muted); font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.nav button svg { width: 21px; height: 21px; flex: none; }
.nav button .nl { display: none; white-space: nowrap; }
.nav button[aria-current="true"] { background: var(--fg); color: var(--bg); }
.nav button[aria-current="true"] .nl { display: inline; }
.nav .kanji { font-size: 16px; line-height: 1; }
.nav .plus { background: var(--fg); color: var(--bg); min-width: 52px; height: 52px; padding: 0; }
.nav .plus svg { width: 22px; height: 22px; }
.back { font-size: 14px; color: var(--muted); margin-bottom: 18px; display: inline-block; }
.spaces { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px; }
.space { background: var(--card); border-radius: 20px; padding: 16px; min-height: 120px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; min-width: 0; }
.space b { font-weight: 700; font-size: 18px; letter-spacing: -.02em; }
.space span { font-size: 13px; color: var(--muted); }
.space .ast, .space svg { width: 22px; height: 22px; color: var(--accent); }
.space.soon { opacity: .45; cursor: default; }
.widgets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wg { background: var(--card); border-radius: 20px; padding: 14px; min-width: 0; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.wg .wl { font-size: 12px; color: var(--muted); }
.wg .wv { font-weight: 500; font-size: 28px; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.wg .wv small { font-size: 13px; color: var(--muted); letter-spacing: 0; margin-left: 3px; }
.wg .slots { display: flex; gap: 3px; flex-wrap: wrap; }
.wg .slots .ast { width: 14px; height: 14px; color: var(--faint); }
.wg .slots .ast.on { color: var(--accent); }
.meter { height: 4px; border-radius: 2px; background: var(--faint); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.meter.hi i { background: var(--fg); }
.env { padding: 14px 0; border-top: 1px solid var(--line); }
.env:first-child { border-top: 0; padding-top: 0; }
.env .eh { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 15px; }
.env .eh span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.env .eh button { font-size: 13px; color: var(--accent); margin-left: 10px; }
.mv { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
.mv:first-child { border-top: 0; }
.mv .grow { flex: 1; min-width: 0; }
.mv .amt { font-variant-numeric: tabular-nums; font-weight: 500; }
.mv .x { color: var(--muted); font-size: 13px; padding: 6px 2px; }
.tag { font-size: 11px; color: var(--accent); margin-left: 6px; }
.rw { background: var(--card); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.rw .rn { font-weight: 700; font-size: 15px; letter-spacing: -.02em; line-height: 1.2; }
.rw .rp { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; font-size: 14px; }
.rw .rp .ast { width: 14px; height: 14px; color: var(--accent); }
.rw .rs { font-size: 11px; color: var(--muted); }
.rw .rb { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
.rw .buy { background: var(--fg); color: var(--bg); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; }
.rw .buy:disabled { background: var(--faint); color: var(--muted); cursor: default; }
.rw .ed { font-size: 12px; color: var(--muted); }
.qa { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.qa button { background: var(--card); border-radius: 18px; padding: 18px 14px; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.qa b { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.qa span { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.chips span { display: block; padding: 9px 13px; border-radius: 999px; background: var(--card); font-size: 13px; }
.chips input:checked + span { background: var(--fg); color: var(--bg); }
.chips input:focus-visible + span { outline: 2px solid var(--fg); outline-offset: 2px; }
.garden { display: flex; justify-content: center; margin-top: 4px; }
.garden.rest .inktree { opacity: .45; filter: grayscale(1); }
.inktree .ink { transform-box: fill-box; transform-origin: center; }
.inktree .lsw { transform-box: fill-box; transform-origin: 50% 90%; }
@media (prefers-reduced-motion: no-preference) {
  .inktree .ink { animation: inkIn 1.5s cubic-bezier(.2,.7,.2,1) both; }
  .inktree .lsw { animation: leafSway 5.5s ease-in-out infinite alternate; }
  .inktree .wash { animation: breathe 6s ease-in-out infinite alternate; }
}
@keyframes inkIn { 0% { opacity: 0; transform: scale(.45); } 65% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }
@keyframes leafSway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes breathe { from { opacity: .2; } to { opacity: .4; } }
.sdesc { font-size: 15px; margin: 12px 0 0; color: var(--fg); }
.restcard { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; margin-top: 26px; padding: 18px; border-radius: 22px; background: linear-gradient(150deg, var(--accent-soft), var(--card) 70%); }
.restcard .rc-ic { width: 44px; height: 44px; border-radius: 50%; background: var(--bg); display: inline-flex; align-items: center; justify-content: center; color: var(--accent); flex: none; }
.restcard .rc-ic svg { width: 22px; height: 22px; }
.restcard .rc-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.restcard .rc-tx b { font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
.restcard .rc-tx span { font-size: 13px; color: var(--muted); }
.restcard .rc-go { font-size: 22px; color: var(--muted); }
.restnow { margin-top: 26px; padding: 20px; border-radius: 24px; background: linear-gradient(160deg, var(--accent-soft), var(--card) 75%); }
.rn-top { display: flex; justify-content: space-between; align-items: center; }
.rn-tag { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--accent); background: var(--bg); padding: 6px 12px 6px 8px; border-radius: 999px; }
.rn-tag svg { width: 18px; height: 18px; }
.rn-end { font-size: 13px; font-weight: 600; background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 999px; }
.rn-big { font-weight: 500; font-size: 76px; letter-spacing: -.03em; line-height: 1; margin-top: 18px; font-variant-numeric: tabular-nums; }
.rn-big small { font-size: 20px; letter-spacing: 0; color: var(--muted); }
.rn-frozen { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--muted); }
.rn-frozen .ast { width: 16px; height: 16px; color: var(--accent); }
.why { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.why label { position: relative; }
.why input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.why span { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 16px; background: var(--card); font-size: 14px; }
.why svg { width: 22px; height: 22px; color: var(--accent); }
.why input:checked + span { background: var(--fg); color: var(--bg); }
.why input:checked + span svg { color: var(--bg); }
.why input:focus-visible + span { outline: 2px solid var(--fg); outline-offset: 2px; }
.rsum { font-size: 14px; margin: 16px 0 0; }
.inktree { display: block; width: 280px; max-width: 86%; height: auto; overflow: visible; }
.inktree.sm { width: 100%; max-width: 150px; margin: 0 auto; }
.inktree .plant { transform-box: view-box; transform-origin: 112px 244px; }
@media (prefers-reduced-motion: no-preference) { .inktree .plant { animation: sway 9s ease-in-out infinite; } }
.lvlhead .kj, .stages .kj2 { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; font-weight: 400; }
.lvlhead .kj { font-size: 22px; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.stages .kj2 { font-size: 15px; color: var(--muted); line-height: 1.2; }
.stages .now .kj2 { color: var(--fg); }
.bonsai { display: block; width: 230px; max-width: 72%; height: auto; overflow: visible; }
.bonsai.sm { width: 100%; max-width: 120px; margin: 0 auto; }
.bonsai .plant { transform-box: view-box; transform-origin: 100px 168px; }
@media (prefers-reduced-motion: no-preference) { .bonsai .plant { animation: sway 7s ease-in-out infinite; } }
@keyframes sway { 0%, 100% { transform: rotate(-0.8deg); } 50% { transform: rotate(0.8deg); } }
.lvlhead { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 18px; }
.lvlhead .rk { font-size: 34px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.lvlhead .lvln { font-size: 64px; color: var(--faint); }
.mood { font-size: 15px; margin: 14px 0 0; }
.stages { display: flex; justify-content: space-between; margin-top: 24px; }
.stages div { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; min-width: 0; }
.stages .ast { display: none; }
.stages span { font-size: 11px; color: var(--muted); }
.stages small { font-size: 9px; color: var(--muted); opacity: .7; }
.stages .past .ast { color: var(--accent); opacity: .5; }
.stages .now .ast { color: var(--accent); width: 22px; height: 22px; }
.stages .now span { color: var(--fg); font-weight: 700; }
.stages .next { opacity: .6; }
.bwg { grid-column: 1 / -1; align-items: center; }
.lvl { margin-top: 26px; }
.lvl .wl { font-size: 15px; color: var(--muted); }
.lvlrow { display: flex; align-items: baseline; gap: 14px; margin-top: 4px; }
.lvlrow .num { font-size: clamp(80px, 26vw, 112px); }
.lvlrow .rk { font-size: 26px; font-weight: 700; letter-spacing: -.03em; }
.gk { flex-wrap: wrap; gap: 18px 26px; margin-top: 26px; }
.gk .wild { display: flex; gap: 4px; padding-top: 4px; }
.gk .wild .ast { width: 22px; height: 22px; color: var(--faint); }
.gk .wild .ast.on { color: var(--accent); }
.xph { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.xph div { flex: 0 0 auto; background: var(--card); border-radius: 14px; padding: 10px 12px; min-width: 64px; }
.xph b { display: block; font-weight: 600; font-variant-numeric: tabular-nums; }
